name: Mesa research
on:
  push:
    branches: ['research/mesa-android']
defaults:
  run:
    shell: bash
jobs:
  look:
    runs-on: ubuntu-24.04
    steps:
    - name: Get Mesa
      run: |
        for v in 25.2.6 25.2.5 25.2.4 25.2.3 25.1.9; do
          if curl -sSfL -o mesa.tar.xz https://archive.mesa3d.org/mesa-$v.tar.xz; then echo "MESA $v"; break; fi
        done
        tar xf mesa.tar.xz && mv mesa-* mesa
        git clone -q --depth 1 https://github.com/bylaws/libadrenotools.git adrenotools
        git -C adrenotools submodule update --init --depth 1 || true
    - name: Pack
      run: |
        mkdir out
        tar czf out/src.tgz mesa/src/egl mesa/src/gallium/drivers/zink mesa/src/gallium/frontends/dri mesa/src/android_stub mesa/meson.options mesa/meson.build mesa/src/gallium/meson.build mesa/src/meson.build mesa/src/gallium/targets/dri mesa/src/loader adrenotools mesa/src/mapi/meson.build mesa/src/glx/meson.build mesa/src/util/u_dl.c mesa/src/util/u_dl.h mesa/docs/android.rst
    - uses: actions/upload-artifact@v4
      with:
        name: src
        path: out/src.tgz
