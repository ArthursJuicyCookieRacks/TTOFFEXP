name: Mesa research
on:
  push:
    branches: ['research/mesa-android']
defaults:
  run:
    shell: bash
env:
  MESA_VERSION: 25.2.6
  ANDROID_NDK: 29.0.14206865
  ANDROID_API: 29
jobs:
  mesa:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: tools/offline/mesa-patches
        path: game
    - uses: android-actions/setup-android@v4
      with:
        packages: 'ndk;${{ env.ANDROID_NDK }}'
    - name: Get the sources
      run: |
        curl -sSfL https://archive.mesa3d.org/mesa-$MESA_VERSION.tar.xz | tar xJ
        mv mesa-$MESA_VERSION mesa
        cd mesa
        for patch in ../game/tools/offline/mesa-patches/*.patch; do patch -p1 < "$patch"; done
        # Built with the NDK alone: no Android system tracing.
        sed -i 's/DETECT_OS_ANDROID/0/' src/util/perf/cpu_trace.h
        echo "Android system headers used:"; grep -rn "include <cutils\|include <log/\|include <sync/\|include <hardware/\|include <vndk\|include <system/" src --include=*.c --include=*.h --include=*.cpp | grep -v "src/android_stub\|src/egl/drivers/dri2/platform_android\|src/util/u_gralloc\|src/vulkan\|src/freedreno\|src/amd\|src/intel\|src/panfrost\|src/broadcom\|src/imagination\|src/virtio\|src/asahi\|src/nouveau\|src/gallium/drivers/[a-y]" || true
        cd ..
        git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/bylaws/libadrenotools.git adrenotools
    - name: Install the build tools
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q ninja-build glslang-tools
        pip install -q meson mako pyyaml packaging
    - name: Build Mesa
      run: |
        NDK=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK
        BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
        cat > android.cross <<CROSS
        [binaries]
        c = '$BIN/aarch64-linux-android$ANDROID_API-clang'
        cpp = '$BIN/aarch64-linux-android$ANDROID_API-clang++'
        ar = '$BIN/llvm-ar'
        strip = '$BIN/llvm-strip'
        pkg-config = '/bin/false'
        [built-in options]
        c_args = ['-DVK_USE_PLATFORM_ANDROID_KHR']
        cpp_args = ['-DVK_USE_PLATFORM_ANDROID_KHR']
        c_link_args = ['-landroid', '-llog']
        cpp_link_args = ['-landroid', '-llog', '-static-libstdc++']
        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8'
        endian = 'little'
        CROSS
        # Mesa's Android code expects a few system libraries an app can't
        # load; what it uses of them is done here with the NDK instead.
        cat > ndkstub.c <<'STUB'
        #include <errno.h>
        #include <linux/sync_file.h>
        #include <poll.h>
        #include <string.h>
        #include <sys/ioctl.h>
        #include <sys/system_properties.h>
        int sync_merge(const char *name, int fd1, int fd2);
        int sync_merge(const char *name, int fd1, int fd2)
        {
           struct sync_merge_data data;
           memset(&data, 0, sizeof(data));
           data.fd2 = fd2;
           strncpy(data.name, name, sizeof(data.name) - 1);
           if (ioctl(fd1, SYNC_IOC_MERGE, &data) < 0)
              return -1;
           return data.fence;
        }
        int sync_wait(int fd, int timeout);
        int sync_wait(int fd, int timeout)
        {
           struct pollfd fds = {fd, POLLIN, 0};
           int ret;
           do {
              ret = poll(&fds, 1, timeout);
           } while (ret == -1 && (errno == EINTR || errno == EAGAIN));
           if (ret == 0) {
              errno = ETIME;
              return -1;
           }
           return ret > 0 ? 0 : -1;
        }
        int property_get(const char *key, char *value, const char *default_value);
        int property_get(const char *key, char *value, const char *default_value)
        {
           int len = __system_property_get(key, value);
           if (len > 0)
              return len;
           len = default_value ? (int)strlen(default_value) : 0;
           if (len > PROP_VALUE_MAX - 1)
              len = PROP_VALUE_MAX - 1;
           if (len)
              memcpy(value, default_value, len);
           value[len] = 0;
           return len;
        }
        STUB
        $BIN/aarch64-linux-android$ANDROID_API-clang -O2 -fPIC -c ndkstub.c -o ndkstub.o
        $BIN/llvm-ar rcs $PWD/libndkstub.a ndkstub.o
        sed -i "s|c_link_args = \['-landroid', '-llog'\]|c_link_args = ['-landroid', '-llog', '$PWD/libndkstub.a']|; s|cpp_link_args = \['-landroid', '-llog',|cpp_link_args = ['-landroid', '-llog', '$PWD/libndkstub.a',|; s|c_args = \['-DVK_USE_PLATFORM_ANDROID_KHR'\]|c_args = ['-DVK_USE_PLATFORM_ANDROID_KHR', '-I$PWD/mesa/include/android_stub']|; s|cpp_args = \['-DVK_USE_PLATFORM_ANDROID_KHR'\]|cpp_args = ['-DVK_USE_PLATFORM_ANDROID_KHR', '-I$PWD/mesa/include/android_stub']|" android.cross
        cat android.cross
        ls mesa/include/android_stub mesa/include/android_stub/*
        cd mesa
        meson setup build --cross-file ../android.cross --prefix=/out -Dallow-fallback-for=libdrm --force-fallback-for=libdrm -Dlibdrm:tests=false -Dlibdrm:intel=disabled -Dlibdrm:radeon=disabled -Dlibdrm:amdgpu=disabled -Dlibdrm:nouveau=disabled -Dlibdrm:vmwgfx=disabled -Dbuildtype=release -Db_ndebug=true \
          -Dplatforms= -Dgallium-drivers=zink -Dvulkan-drivers= -Degl=enabled -Dgles1=disabled -Dgles2=enabled \
          -Dglx=disabled -Dgbm=disabled -Dllvm=disabled -Dxmlconfig=disabled -Dzstd=disabled -Dvalgrind=disabled \
          -Dlibunwind=disabled -Degl-lib-suffix=_mesa -Dgles-lib-suffix=_mesa -Dshader-cache=disabled \
          -Dlmsensors=disabled -Dvideo-codecs= -Dgallium-va=disabled -Dgallium-vdpau=disabled \
          -Dgallium-extra-hud=false -Dbuild-tests=false 2>&1 | grep -v "^Running compile\|^Code\|^Command line\|^-----\|^Working dir" | tail -120
        ninja -C build -k 0 > ../ninja.log 2>&1 || { grep -B2 -A6 "error:\|undefined" ../ninja.log | grep -v "^/usr/local/lib/android" | head -200; exit 1; }
        DESTDIR=$PWD/../install ninja -C build install > /dev/null
        cd ..
        find install -name "*.so*" | xargs ls -la
        for f in $(find install -name "*.so"); do echo "== $f"; $BIN/llvm-readelf -d $f | grep -E "NEEDED|SONAME"; done
    - name: Build adrenotools
      run: |
        NDK=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK
        cmake -S adrenotools -B adrenotools/build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=$ANDROID_API -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
        ninja -C adrenotools/build
        find adrenotools/build -name "*.so" | xargs ls -la
    - name: Pack
      if: always()
      run: |
        mkdir -p out
        cp $(find install -name "*.so*" -type f) out/ 2>/dev/null || true
        cp $(find adrenotools/build -name "*.so") out/ 2>/dev/null || true
        ls -la out
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mesa-android-arm64
        path: out
